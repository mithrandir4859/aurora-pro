---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/mithrandir4859/aurora-pro
name: aurora-pro
description: Aurora DX with Kvantum and snapper baked in, so nothing has to be layered.

# Aurora DX, KDE developer image. `stable` is the weekly, kernel-gated stream --
# the same thing this machine is already rebased to.
base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

# module configuration, executed in order
modules:
  # copies files/system/* into the image root. Currently empty -- this is where
  # a snapper config or a udev rule would go later.
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        # Qt style engine. Was a layered package before this image existed.
        - kvantum
        # btrfs snapshots for the subvolumes ostree does not cover.
        # Does NOT replace ostree rollback for the OS itself.
        - snapper
        # --- later ---
        # Steam is multilib; if the dnf module trips over i686 deps, drop to a
        # `containerfile` module running dnf5 directly instead.
        # - steam
        # - steam-devices
        # - lutris
        # - mangohud
        # - gamescope

  # sets up the policy & signing files so signed images verify properly
  - type: signing
